<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이템 도감</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Pretendard 폰트 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-xs">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">아이템 도감</h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-xs cursor-pointer">
                + 아이템 추가
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl w-full mx-auto px-6 py-8 flex-grow">
        
        <!-- 검색 및 획득처 필터 영역 -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <!-- 검색바 -->
            <div class="relative flex-grow">
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="아이템 이름, 종류, 획득처 또는 설명 검색..." 
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <!-- 정렬 버튼 추가 -->
            <button onclick="toggleSort()" id="sortBtn" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 text-xs font-medium px-4 py-2.5 rounded-lg transition-colors cursor-pointer shrink-0">
                정렬: 기본 순
            </button>
        </div>

        <!-- 획득처 필터 -->
        <div id="sourceFilters" class="flex flex-wrap gap-2 mb-8">
            <!-- 동적으로 생성됨 -->
        </div>

        <!-- 아이템 목록 그리드 -->
        <div id="itemGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 동적으로 생성됨 -->
        </div>

        <!-- 검색 결과 없음 안내 -->
        <div id="noResult" class="hidden text-center py-16 text-gray-400 text-sm">
            등록된 아이템이 없거나 검색 결과가 없습니다.
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="text-center py-6 text-xs text-gray-400 border-t border-gray-200 mt-auto">
        &copy; Item Compendium. All rights reserved.
    </footer>

    <!-- 아이템 추가/수정 모달 -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative animate-in fade-in zoom-in duration-150">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-900 mb-4">새 아이템 추가</h2>
            <form id="addItemForm" onsubmit="handleSaveItem(event)" class="space-y-4">
                <!-- 수정 시 아이템 구분을 위한 숨김 필드 -->
                <input type="hidden" id="editIndexId" value="">

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">획득처</label>
                    <input type="text" id="inputSource" list="sourceList" required placeholder="예: 우주 쇼핑몰, 검역 실패 등"
                        class="w-full bg-white border border-gray-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <datalist id="sourceList"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">아이템 종류</label>
                    <input type="text" id="inputCategory" list="categoryList" required placeholder="예: 소모품, 장비, 물약 등"
                        class="w-full bg-white border border-gray-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <datalist id="categoryList">
                        <option value="무기">
                        <option value="방어구">
                        <option value="소모품">
                        <option value="장신구">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">아이템 이름</label>
                    <input type="text" id="inputName" required placeholder="아이템 이름을 입력하세요"
                        class="w-full bg-white border border-gray-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">가격</label>
                    <input type="text" id="inputPrice" required placeholder="500P 또는 가격 없음"
                        class="w-full bg-white border border-gray-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">설명</label>
                    <textarea id="inputDesc" rows="3" required placeholder="아이템 설명을 입력하세요"
                        class="w-full bg-white border border-gray-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">
                        취소
                    </button>
                    <button type="submit" id="submitBtnText" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors shadow-xs cursor-pointer">
                        추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        const defaultItems = [
             { id: 1, source: "우주 쇼핑몰", type: "물약", name: "포도맛 물약", price: "1,500 P", description: "사용 시 3 일간 성별이 바뀝니다." },
             { id: 2, source: "우주 쇼핑몰", type: "물약", name: "오렌맛 물약", price: "1,500 P", description: "사용 시 3 일간 어린이 상태가 됩니다." },

        ];

        let items = JSON.parse(localStorage.getItem('compendium_items')) || defaultItems;
        let currentSource = '전체';
        let isSortedByName = false; // 정렬 상태 플래그

        document.addEventListener('DOMContentLoaded', () => {
            renderSources();
            filterItems();
        });

        // 정렬 토글 함수
        function toggleSort() {
            isSortedByName = !isSortedByName;
            const sortBtn = document.getElementById('sortBtn');
            if (isSortedByName) {
                sortBtn.innerText = "정렬: 가나다 순";
                sortBtn.className = "bg-indigo-50 border border-indigo-300 text-indigo-700 text-xs font-medium px-4 py-2.5 rounded-lg transition-colors cursor-pointer shrink-0";
            } else {
                sortBtn.innerText = "정렬: 기본 순";
                sortBtn.className = "bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 text-xs font-medium px-4 py-2.5 rounded-lg transition-colors cursor-pointer shrink-0";
            }
            filterItems();
        }

        function renderSources() {
            const sources = ['전체', ...new Set(items.map(item => item.source))];
            const filterContainer = document.getElementById('sourceFilters');
            const sourceDataList = document.getElementById('sourceList');

            filterContainer.innerHTML = sources.map(src => `
                <button onclick="setSource('${src}')" 
                    class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors cursor-pointer ${currentSource === src ? 'bg-indigo-600 text-white shadow-xs' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100'}">
                    ${src}
                </button>
            `).join('');

            sourceDataList.innerHTML = sources.filter(s => s !== '전체').map(src => `<option value="${src}">`).join('');
        }

        function setSource(source) {
            currentSource = source;
            renderSources();
            filterItems();
        }

        function filterItems() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('itemGrid');
            const noResult = document.getElementById('noResult');

            // 1. 필터링 적용
            let filtered = items.filter(item => {
                const matchesSource = currentSource === '전체' || item.source === currentSource;
                const matchesKeyword = item.name.toLowerCase().includes(keyword) || 
                                       item.type.toLowerCase().includes(keyword) || 
                                       item.description.toLowerCase().includes(keyword) ||
                                       item.source.toLowerCase().includes(keyword);
                return matchesSource && matchesKeyword;
            });

            // 2. 가나다 순 정렬 적용 (활성화된 경우)
            if (isSortedByName) {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResult.classList.remove('hidden');
                return;
            }

            noResult.classList.add('hidden');
            grid.innerHTML = filtered.map(item => `
                <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-xs hover:shadow-md transition-shadow flex flex-col justify-between">
                    <div>
                        <!-- 상단 태그 및 수정/삭제 버튼 -->
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex gap-1.5">
                                <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-md">${item.source}</span>
                                <span class="text-xs font-semibold px-2 py-0.5 bg-gray-100 text-gray-600 rounded-md">${item.type}</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="openEditModal(${item.id})" class="text-gray-400 hover:text-indigo-600 text-xs transition-colors cursor-pointer" title="수정">수정</button>
                                <button onclick="deleteItem(${item.id})" class="text-gray-300 hover:text-red-500 text-xs transition-colors cursor-pointer" title="삭제">삭제</button>
                            </div>
                        </div>
                        
                        <!-- 아이템 이름 및 가격 -->
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="font-bold text-gray-900 text-base">${item.name}</h3>
                            <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200/50">${item.price || '가격 없음'}</span>
                        </div>

                        <!-- 설명 -->
                        <p class="text-sm text-gray-600 leading-relaxed">${item.description}</p>
                    </div>
                </div>
            `).join('');
        }

        // 모달 열기 (추가 모드)
        function openModal() {
            document.getElementById('modalTitle').innerText = '새 아이템 추가';
            document.getElementById('submitBtnText').innerText = '추가하기';
            document.getElementById('editIndexId').value = '';
            document.getElementById('addItemForm').reset();

            document.getElementById('itemModal').classList.remove('hidden');
            document.getElementById('itemModal').classList.add('flex');
        }

        // 모달 열기 (수정 모드)
        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = '아이템 수정';
            document.getElementById('submitBtnText').innerText = '수정하기';
            document.getElementById('editIndexId').value = item.id;

            document.getElementById('inputSource').value = item.source;
            document.getElementById('inputCategory').value = item.type;
            document.getElementById('inputName').value = item.name;
            document.getElementById('inputPrice').value = item.price;
            document.getElementById('inputDesc').value = item.description;

            document.getElementById('itemModal').classList.remove('hidden');
            document.getElementById('itemModal').classList.add('flex');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
            document.getElementById('itemModal').classList.remove('flex');
            document.getElementById('addItemForm').reset();
            document.getElementById('editIndexId').value = '';
        }

        // 저장 처리 (추가 또는 수정 분기)
        function handleSaveItem(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editIndexId').value;
            const source = document.getElementById('inputSource').value.trim();
            const type = document.getElementById('inputCategory').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const price = document.getElementById('inputPrice').value.trim();
            const description = document.getElementById('inputDesc').value.trim();

            if (editId) {
                // 수정
                items = items.map(item => {
                    if (item.id == editId) {
                        return { ...item, source, type, name, price, description };
                    }
                    return item;
                });
            } else {
                // 추가
                const newItem = {
                    id: Date.now(),
                    source,
                    type,
                    name,
                    price,
                    description
                };
                items.push(newItem);
            }

            saveAndRefresh();
            closeModal();
        }

        // 아이템 삭제
        function deleteItem(id) {
            if (confirm('이 아이템을 삭제하시겠습니까?')) {
                items = items.filter(item => item.id !== id);
                saveAndRefresh();
            }
        }

        // 로컬 스토리지 저장 및 화면 갱신
        function saveAndRefresh() {
            localStorage.setItem('compendium_items', JSON.stringify(items));
            renderSources();
            filterItems();
        }
    </script>
</body>
</html>
