<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이템 도감</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">아이템 도감</h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors cursor-pointer shadow-xs flex items-center gap-1.5">
                <span>➕</span> 아이템 추가
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- Search, Filter & Sort Bar -->
        <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center bg-white p-4 rounded-xl border border-gray-200 shadow-xs">
            <!-- Search Input -->
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"></span>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="아이템 이름 또는 설명 검색..." 
                    class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            </div>

            <!-- Sort Selector -->
            <div class="flex items-center gap-2">
                <select id="sortSelect" onchange="handleSort()" class="px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                    <option value="default">정렬: 기본순</option>
                    <option value="nameAsc">이름: 가나다 순</option>
                    <option value="priceDesc">가격: 비싼 순</option>
                    <option value="priceAsc">가격: 싼 순</option>
                </select>
            </div>
        </div>

        <!-- Source Filters -->
        <div id="sourceFilters" class="flex flex-wrap gap-1.5 items-center">
            <!-- JS dynamically injects source buttons here -->
        </div>

        <!-- Item Grid -->
        <div id="itemGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- JS dynamically injects item cards here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <p class="text-4xl mb-2">📭</p>
            <p class="text-gray-500 font-medium">검색된 아이템이 없습니다.</p>
        </div>
    </main>

    <!-- Modal (Add / Edit) -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden flex flex-col animate-in fade-in zoom-in duration-150">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 id="modalTitle" class="font-bold text-gray-900">새 아이템 추가</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">&times;</button>
            </div>
            <form id="itemForm" onsubmit="handleFormSubmit(event)" class="p-6 flex flex-col gap-4">
                <input type="hidden" id="itemId">
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase">아이템 이름</label>
                    <input type="text" id="itemName" required placeholder="예: 복숭아맛 물약"
                        class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase">획득처</label>
                    <input type="text" id="itemSource" required list="sourceList" placeholder="예: 유쾌 판매소"
                        class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <datalist id="sourceList"></datalist>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase">가격 (숫자만 입력)</label>
                    <input type="number" id="itemPrice" min="0" placeholder="예: 1000 (선택사항)"
                        class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-gray-600 uppercase">설명</label>
                    <textarea id="itemDescription" rows="3" required placeholder="아이템에 대한 설명을 입력하세요..."
                        class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2.5 mt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-100 cursor-pointer">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 cursor-pointer shadow-xs">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-400 border-t border-gray-200 mt-auto">
        &copy; 아이템 도감 시스템. All rights reserved.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let items = [];
        let currentSource = '전체';
        let searchQuery = '';
        let currentSort = 'default';

        // 데이터 불러오기 (초기 실행)
        async function fetchItems() {
            try {
                const res = await fetch('/api/items');
                if (!res.ok) throw new Error('데이터를 불러오지 못했습니다.');
                items = await res.json();
                renderSources();
                renderItems();
            } catch (err) {
                console.error(err);
                alert('서버로부터 아이템 목록을 불러오는 중 오류가 발생했습니다.');
            }
        }

        // 획득처 필터 버튼 및 datalist 렌더링 (순서 고정 적용)
        function renderSources() {
            const rawSources = [...new Set(items.map(item => item.source))];
            
            const customOrder = ["유쾌 판매소", "???", "우주 쇼핑몰", "어둠 탐사", "그 외"];

            const sortedSources = customOrder.filter(src => rawSources.includes(src));
            const others = rawSources.filter(src => !customOrder.includes(src));
            
            const sources = ['전체', ...sortedSources, ...others];

            const filterContainer = document.getElementById('sourceFilters');
            const sourceDataList = document.getElementById('sourceList');

            filterContainer.innerHTML = sources.map(src => `
                <button onclick="setSource('${src}')" 
                    class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors cursor-pointer ${currentSource === src ? 'bg-indigo-600 text-white shadow-xs' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100'}">
                    ${src}
                </button>
            `).join('');

            sourceDataList.innerHTML = rawSources.map(src => `<option value="${src}">`).join('');
        }

        // 아이템 카드 목록 렌더링
        function renderItems() {
            const grid = document.getElementById('itemGrid');
            const emptyState = document.getElementById('emptyState');

            // 1. 필터링 적용
            let filtered = items.filter(item => {
                const matchesSource = (currentSource === '전체' || item.source === currentSource);
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesSource && matchesSearch;
            });

            // 2. 정렬 적용
            filtered.sort((a, b) => {
                if (currentSort === 'nameAsc') {
                    return a.name.localeCompare(b.name, 'ko'); // 가나다 순
                } else if (currentSort === 'priceDesc') {
                    return (Number(b.price) || 0) - (Number(a.price) || 0); // 비싼 순
                } else if (currentSort === 'priceAsc') {
                    return (Number(a.price) || 0) - (Number(b.price) || 0); // 싼 순
                } else {
                    return 0; // 기본순
                }
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.remove('flex');
            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-xs hover:shadow-md transition-shadow flex flex-col justify-between gap-3 relative group">
                    <div class="flex flex-col gap-1.5">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-bold text-gray-900 text-base leading-snug">${escapeHtml(item.name)}</h3>
                            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-md text-[11px] font-medium shrink-0 border border-indigo-100">${escapeHtml(item.source)}</span>
                        </div>
                        ${item.price !== undefined && item.price !== null && item.price !== '' ? `
                            <p class="text-xs font-semibold text-emerald-600"> ${Number(item.price).toLocaleString()} P </p>
                        ` : ''}
                        <p class="text-sm text-gray-600 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.description)}</p>
                    </div>
                    <div class="flex justify-end gap-1 pt-2 border-t border-gray-100 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openEditModal(${item.id})" class="text-xs px-2.5 py-1 text-gray-600 hover:bg-gray-100 rounded-md transition-colors cursor-pointer font-medium">수정</button>
                        <button onclick="deleteItem(${item.id})" class="text-xs px-2.5 py-1 text-rose-600 hover:bg-rose-50 rounded-md transition-colors cursor-pointer font-medium">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        // 검색어 입력 핸들러
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderItems();
        }

        // 정렬 기준 변경 핸들러
        function handleSort() {
            currentSort = document.getElementById('sortSelect').value;
            renderItems();
        }

        // 획득처 탭 선택 핸들러
        function setSource(src) {
            currentSource = src;
            renderSources();
            renderItems();
        }

        // 모달 열기 (추가 모드)
        function openModal() {
            document.getElementById('modalTitle').innerText = '새 아이템 추가';
            document.getElementById('itemId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemSource').value = currentSource === '전체' ? '' : currentSource;
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemModal').classList.remove('hidden');
            document.getElementById('itemModal').classList.add('flex');
        }

        // 모달 열기 (수정 모드)
        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = '아이템 수정';
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemSource').value = item.source;
            document.getElementById('itemPrice').value = item.price !== undefined ? item.price : '';
            document.getElementById('itemDescription').value = item.description;
            document.getElementById('itemModal').classList.remove('hidden');
            document.getElementById('itemModal').classList.add('flex');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('itemModal').classList.remove('flex');
            document.getElementById('itemModal').classList.add('hidden');
        }

        // 폼 제출 (추가 또는 수정 API 호출)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const source = document.getElementById('itemSource').value;
            const price = document.getElementById('itemPrice').value ? Number(document.getElementById('itemPrice').value) : 0;
            const description = document.getElementById('itemDescription').value;

            const payload = { name, source, price, description };

            try {
                let res;
                if (id) {
                    // 수정 (PUT)
                    payload.id = Number(id);
                    res = await fetch('/api/items', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // 추가 (POST)
                    res = await fetch('/api/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (!res.ok) throw new Error('저장에 실패했습니다.');

                closeModal();
                fetchItems(); // 데이터 새로고침
            } catch (err) {
                console.error(err);
                alert('처리 중 오류가 발생했습니다.');
            }
        }

        // 삭제 (DELETE)
        async function deleteItem(id) {
            if (!confirm('정말 이 아이템을 삭제하시겠습니까?')) return;

            try {
                const res = await fetch(`/api/items?id=${id}`, {
                    method: 'DELETE'
                });

                if (!res.ok) throw new Error('삭제에 실패했습니다.');
                fetchItems();
            } catch (err) {
                console.error(err);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        // XSS 방지 유틸리티
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 페이지 최초 로드 시 실행
        fetchItems();
    </script>
</body>
</html>
